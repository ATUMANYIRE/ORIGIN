name: ORIGIN CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  backend-verify:
    name: Backend Lint, Typecheck, Migrations & Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        working-directory: ./backend
        run: ruff check app tests alembic

      - name: Run Mypy Strict Type Checking
        working-directory: ./backend
        run: mypy app

      - name: Run Pytest Unit & Integration Suite (incl. Alembic Migrations)
        working-directory: ./backend
        run: pytest -v

  frontend-verify:
    name: Frontend Typecheck, Vitest & Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run TypeScript Strict Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Vitest Unit Suite
        working-directory: ./frontend
        run: npm run test

      - name: Run Next.js Production Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
